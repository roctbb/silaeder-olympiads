[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "olympiads-calendar"
version = "0.1.0"
description = "API for the school olympiad calendar"
requires-python = ">=3.11"
dependencies = [
  "Authlib>=1.6,<2",
  "cachelib>=0.13,<1",
  "Flask>=3.1,<4",
  "Flask-Cors>=5,<7",
  "Flask-Migrate>=4,<5",
  "Flask-Session>=0.8,<1",
  "Flask-SQLAlchemy>=3.1,<4",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "requests>=2.32,<3",
  "redis>=5,<7",
  "celery[redis]>=5.4,<6",
  "gunicorn>=23,<24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
